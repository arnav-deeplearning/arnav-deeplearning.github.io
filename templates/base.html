<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.title }}{% endblock %}</title>
<meta name="description" content="{{ site.tagline }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥋</text></svg>">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">🥋</span>
      <span class="brand-text">{{ site.short_name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <button class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="navLinks">
        {% for item in nav %}
        <li>
          <a href="{{ item.href }}" class="{{ 'active' if active_page == item.href else '' }}">{{ item.label }}</a>
        </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <span class="brand-mark">🥋</span>
      <strong>{{ site.name }}</strong>
      <p class="muted">{{ site.tagline }}</p>
    </div>
    <div class="footer-links">
      <span class="muted">&copy; {{ site.short_name }}. Built with Python.</span>
    </div>
  </div>
</footer>

<script src="static/js/main.js"></script>
</body>
</html>
